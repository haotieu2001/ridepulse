# What Debezium Server does in dev, with no secrets: the boot script adds the Neon host and login and the
# Confluent endpoint and keys from SSM. One file per environment (var.env).

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=cdc
debezium.source.plugin.name=pgoutput

# V001's publication decides what leaves the database; Debezium must never widen it.
debezium.source.slot.name=ridepulse_debezium
debezium.source.publication.name=ridepulse_cdc
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=dispatch.outbox,dispatch.drivers,dispatch.driver_profiles,dispatch.replay_state,dispatch.replay_runs

# With offsets kept and a slot still there, a restart resumes. Otherwise (a teardown dropped the slot) it
# re-reads the published tables, which are small; the outbox is empty at rest, so it adds no trip events.
debezium.source.snapshot.mode=when_needed
debezium.source.heartbeat.interval.ms=60000

# NUMERIC as exact strings ("49.53"), not base64 binary decimals ("E1k=").
debezium.source.decimal.handling.mode=string

# Offsets outlive the instance (it is destroyed after each demo window).
debezium.source.offset.storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.source.offset.storage.topic=debezium.offsets
debezium.source.offset.storage.partitions=1
debezium.source.offset.storage.replication.factor=3
debezium.source.offset.flush.interval.ms=0

# outbox -> trips.v1, keyed by trip_key, with the outbox columns moved into an envelope (contracts/events).
# Only that table: the predicate leaves the others as plain table CDC.
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.predicate=isOutbox
debezium.transforms.outbox.route.topic.replacement=trips.v1
debezium.transforms.outbox.table.fields.additional.placement=id:envelope:event_id,type:envelope:event_type,occurred_at:envelope:occurred_at
debezium.transforms.outbox.table.op.invalid.behavior=debug
debezium.predicates=isOutbox
debezium.predicates.isOutbox.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.isOutbox.pattern=cdc.dispatch.outbox

debezium.sink.type=kafka
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false
