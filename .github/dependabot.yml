# Version updates (#38). Security updates are on in the repository settings and ignore the cooldown. The cooldown is
# the pinning rule: a release must be at least two weeks old before anything here uses it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # pyspark follows the pipelines' Databricks Runtime (18: Spark 4.1), so the local Spark tests run what production
    # runs. Patches only; a minor or major move comes with a runtime change, by hand.
    ignore:
      - dependency-name: pyspark
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/landing
      - /infra/terraform/confluent
      - /infra/terraform/debezium
      - /infra/terraform/replayer
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      providers:
        patterns: ["*"]
