name: prep

# The monthly prep job (services/prep, ADR-0004 §4-6): one landed TLC month -> contract check,
# quarantine, 5% sample and event-time slices in the landing bucket. Run once per month after
# `make land-month`; a rerun for an unchanged source is a no-op unless forced. The job prints its
# run time and peak memory, and GNU time measures the whole process as a cross-check.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "TLC month, YYYY-MM (must be landed)"
        required: true
      force:
        description: "Rebuild even if this version is already prepared"
        type: boolean
        default: false
      target_utilisation:
        description: "supply.target_utilisation (ADR-0003)"
        default: "0.6"

permissions:
  contents: read
  id-token: write   # OIDC: short-lived AWS credentials for the ridepulse-github-ci role

concurrency:
  group: prep-${{ inputs.month }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANDING_BUCKET: ridepulse-landing-dev-121403124761
      MONTH: ${{ inputs.month }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      TARGET_UTILISATION: ${{ inputs.target_utilisation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Pinned to a commit SHA, and to a release at least two weeks old.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::121403124761:role/ridepulse-github-ci
          aws-region: us-east-2
      - name: Prep
        run: /usr/bin/time -v uv run --frozen python -m services.prep "$MONTH" --target-utilisation "$TARGET_UTILISATION" $FORCE
