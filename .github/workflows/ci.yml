name: ci

# Every pull request and push to main. Five jobs:
#   test       lint, unit, contract and Postgres tests (no secrets: a throwaway postgres service), types
#   security   secrets in the history, Terraform misconfigurations, known vulnerabilities in dependencies
#   cdc        Postgres -> Debezium -> Kafka for real: every trip event once, in the contracts' envelope
#   terraform  fmt and validate for every stack; a real plan for the stacks a read-only role can plan
#   bundle     the Databricks bundle validated for stg, and the Lambda zips built
# Deploying is deploy.yml's job, from main only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same major version as Neon (18); pinned by digest to a release at least two weeks old.
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a commit SHA, and to a release at least two weeks old (v10.3.3 was a day old).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # A JVM for the Spark tests (#26, #76): pyspark 4.0 runs a local Spark on Java 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      # Types in basic mode (pyrightconfig.json, #76), on the venv the tests just built. Pinned, like the actions.
      - name: Types
        run: uvx pyright@1.1.408

  # Secrets in the history, misconfigured infrastructure and vulnerable dependencies (#38). The scanners are release
  # binaries pinned by version and SHA-256 (no third-party actions), each release at least two weeks old.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # gitleaks reads the whole history
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Scanners
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
                            "$TRIVY_SHA256" "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secrets in the git history
        run: gitleaks detect --source . --no-banner --redact
      - name: Infrastructure misconfigurations (accepted ones are in .trivyignore.yaml, with why)
        run: trivy config --quiet --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 infra/terraform
      - name: Known vulnerabilities in the locked Python dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # Postgres -> Debezium -> Kafka for real (#76): a month of ticks into a Postgres with logical WAL, Debezium Server with
  # dev's own config (only the endpoints differ, ci/cdc/local.properties), Redpanda as Kafka. The test checks that
  # every trip event reaches trips.v1 once, in the contracts' envelope.
  cdc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      DEBEZIUM_VERSION: 3.7.0.Final   # infra/terraform/debezium/main.tf
      DEBEZIUM_SHA512: 3c539d78d9ac4c2e13db7adb0f3cfcb0399e67c2a2d3feb4d2a43b3e42f15d6a4eb9463d07a16b6f71b736ded56d9c33dd5b0cfb71752bd57387aec824b3c0fd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Postgres with logical WAL, and Redpanda
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636 -c wal_level=logical
          docker run -d --name kafka -p 9092:9092 \
            redpandadata/redpanda:v26.2.5@sha256:badca2d958f81da675c3055a9ecb6ebb590325582bcf16936148ffd65e96e920 \
            redpanda start --mode dev-container --smp 1 --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
          until docker exec pg pg_isready -U postgres; do sleep 1; done
      - name: Dispatch schema
        run: uv run python db/migrate.py --schema dispatch
      - name: Debezium Server, dev's config with local endpoints
        run: |
          curl -fsSL --retry 3 -o debezium.tar.gz \
            "https://repo1.maven.org/maven2/io/debezium/debezium-server-dist/$DEBEZIUM_VERSION/debezium-server-dist-$DEBEZIUM_VERSION.tar.gz"
          echo "$DEBEZIUM_SHA512  debezium.tar.gz" | sha512sum -c -
          tar -xzf debezium.tar.gz
          cp debezium-server/lib_opt/debezium-connect-plugins-*.jar debezium-server/lib/   # the outbox router, as in dev
          cat infra/terraform/debezium/env/dev.properties ci/cdc/local.properties > debezium-server/config/application.properties
          (cd debezium-server && ./run.sh > ../debezium.log 2>&1 &)
          for i in $(seq 1 90); do
            psql -Atc "SELECT active FROM pg_replication_slots WHERE slot_name = 'ridepulse_debezium'" | grep -q t && exit 0
            sleep 2
          done
          echo "Debezium's slot never became active"; tail -50 debezium.log; exit 1
      - name: Every event reaches Kafka once
        run: RIDEPULSE_CDC_BOOTSTRAP=localhost:9092 uv run pytest services/replayer/tests/test_cdc_integration.py -v
      - name: Debezium's log
        if: failure()
        run: tail -100 debezium.log

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC: the read-only ridepulse-github-ci role, for plans
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # 1.17.0 is younger than the two-week rule, but the state was written by it, and older Terraform
      # refuses newer state. Pinned to the laptop's version on purpose.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Build the Lambda zips (the replayer stack hashes them, even to validate)
        run: scripts/build_lambdas.sh && grep -H . build/*.contenthash && cat build/replayer.manifest
      - name: Validate every stack
        run: |
          for stack in infra/terraform/*/; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::121403124761:role/ridepulse-github-ci
          aws-region: us-east-2
      # Plans need only read access. Not planned here: confluent (its plan needs the Confluent Cloud admin key,
      # which CI must not hold) and bootstrap (needs the alert email, and manages this very role).
      # -lock=false: a plan never writes state, and must not block an apply running on a laptop.
      - name: Plan
        run: |
          for stack in landing debezium replayer; do
            dir="infra/terraform/$stack"
            terraform -chdir="$dir" init -input=false >/dev/null
            set +e
            terraform -chdir="$dir" plan -input=false -lock=false -no-color -detailed-exitcode > "plan-$stack.txt" 2>&1
            code=$?
            set -e
            summary="$(grep -E '^(Plan:|No changes)' "plan-$stack.txt" || true)"
            echo "$stack: ${summary:-plan failed}"
            echo "### $stack: ${summary:-plan failed}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" = 1 ]; then cat "plan-$stack.txt"; exit 1; fi
            if [ "$code" = 2 ]; then { echo '```'; grep -E '^  # ' "plan-$stack.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_HOST: https://dbc-f915d382-6d5f.cloud.databricks.com
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@8de769ec2543ee05e456ee2121350efc7efc4bda # v1.22.1
      # Dependabot and fork PRs get no repository secrets, so they can't reach the workspace. They're said to be
      # skipped, not passed off as validated; every push to main validates with the secrets.
      - name: Validate the bundle for stg
        working-directory: databricks
        run: |
          if [ -z "$DATABRICKS_CLIENT_ID" ]; then
            msg="Bundle not validated: this run has no workspace secrets (Dependabot or a fork). main validates it on merge."
            echo "::notice::$msg"; echo "### $msg" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          databricks bundle validate -t stg
