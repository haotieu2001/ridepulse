# Kafka -> bronze (#13) -> silver (#16), one triggered pipeline: each run reads what arrived since the last one
# and stops, so the job below makes it "availableNow every 10 minutes". Silver shares the update with bronze, so
# the replay watermark and the trip events it covers land together (ADR-0004 §7). The schedule starts paused: demo windows (#12)
# unpause it, so nothing reads Kafka or spends quota outside them.
resources:
  pipelines:
    bronze_ingest:
      name: streaming
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../src/bronze/pipeline.py
        - file:
            path: ../src/silver/silver.py
        - file:
            path: ../src/silver/state.py
      configuration:
        ridepulse.kafka.bootstrap: ${var.kafka_bootstrap}
        ridepulse.secret_scope: ridepulse
        ridepulse.ping_schema_path: ${workspace.file_path}/src/bronze/driver_location.avsc
        ridepulse.ping_schema_ids: "100002"
        ridepulse.catalog: ${var.catalog}
        ridepulse.silver_dir: ${workspace.file_path}/src/silver
        # Debezium's TIMESTAMP microseconds are read as UTC, so the simulated clock keeps its wall value.
        spark.sql.session.timeZone: UTC

  jobs:
    bronze_every_10_min:
      name: bronze_every_10_min
      schedule:
        # The window hours from config/window.json, plus the hour after it to read the last ticks (a test checks).
        quartz_cron_expression: "0 0/10 12-15 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_ingest.id}
