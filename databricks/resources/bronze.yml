# Kafka -> bronze (#13) -> silver (#16) -> supply and rules (#20) -> the alert sink (#22), one pipeline. Silver shares
# it with bronze, so the replay watermark and the trip events it covers land together (ADR-0004 §7).
#
# Continuous (#25): a triggered run every 10 minutes took ~10.5 minutes (3 to start, then every table), so alerts
# reached email at p95 24 min against SLA-1's 12. Continuous, the streams run in micro-batches of seconds and the
# views that are recomputed in full refresh on their own every 10 minutes (spark_conf pipelines.trigger.interval).
# The window Lambda (services/window) starts it when a demo window opens and stops it when it closes, as the
# ridepulse-window service principal, so nothing reads Kafka or spends quota outside a window. Stg stays triggered:
# CI deploys it, and nothing would stop a continuous one.
resources:
  pipelines:
    bronze_ingest:
      name: streaming
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../src/bronze/pipeline.py
        - file:
            path: ../src/silver/silver.py
        - file:
            path: ../src/silver/state.py
        - file:
            path: ../src/ref/ref.py
        - file:
            path: ../src/ops/kpis.py
        - file:
            path: ../src/ops/supply.py
        - file:
            path: ../src/ops/rules.py
        - file:
            path: ../src/ops/alerts.py
      configuration:
        ridepulse.kafka.bootstrap: ${var.kafka_bootstrap}
        ridepulse.secret_scope: ridepulse
        ridepulse.ping_schema_path: ${workspace.file_path}/src/bronze/driver_location.avsc
        ridepulse.ping_schema_ids: "100002"
        ridepulse.catalog: ${var.catalog}
        ridepulse.silver_dir: ${workspace.file_path}/src/silver
        ridepulse.ref_dir: ${workspace.file_path}/src/ref
        # Debezium's TIMESTAMP microseconds are read as UTC, so the simulated clock keeps its wall value.
        spark.sql.session.timeZone: UTC
