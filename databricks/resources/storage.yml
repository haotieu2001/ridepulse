resources:
  schemas:
    raw:
      catalog_name: ${var.catalog}
      name: raw
      comment: Landed source files (TLC, NOAA, rule book, payouts).
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Raw records as ingested.
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Typed, checked and deduplicated records.
    ref:
      catalog_name: ${var.catalog}
      name: ref
      comment: Reference data and rule configuration.
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: The star schema (docs/index.html#gold) with its keys, and the metric view for Genie.
    ops:
      catalog_name: ${var.catalog}
      name: ops
      comment: What on-call reads, refreshed every pipeline update - live KPIs, late events, alerts.

  volumes:
    tlc:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: tlc
      volume_type: MANAGED
      comment: TLC monthly Parquet files, pushed through the Files API.
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: landing
      volume_type: MANAGED
      comment: >-
        The landing bucket's raw/ files of every registered source (config/file_sources.json), at the same keys,
        copied by the forwarder Lambda (#26). Free Edition can't read the bucket itself.
    checkpoints:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.raw.name}
      name: checkpoints
      volume_type: MANAGED
      comment: Auto Loader checkpoints and inferred schemas, one folder per file source (#26).
