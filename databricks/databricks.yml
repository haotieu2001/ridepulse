bundle:
  name: ridepulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: ridepulse_dev
  tlc_month:
    description: TLC high-volume FHV month used by feasibility test S10 (YYYY-MM).
    default: "2025-01"

targets:
  dev:
    default: true
    # No `mode: development`: it renames schemas to dev_<user>_raw and ignores an
    # empty name_prefix. The catalog already separates environments, so the
    # plain names the plan uses (ridepulse_dev.raw.tlc) stay.
    workspace:
      profile: ridepulse
    variables:
      catalog: ridepulse_dev
    resources:
      pipelines:
        # S9 / plan path C: daily query-based pull from the Neon dispatch database,
        # incremental on the updated_at cursor. Dev only: the neon_dev connection
        # and its secret belong to this environment.
        s9_neon_reference:
          name: s9_neon_reference
          catalog: ${var.catalog}
          schema: bronze
          ingestion_definition:
            connection_name: neon_dev
            objects:
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: driver_profiles
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: ref_driver_profiles
                  table_configuration:
                    scd_type: SCD_TYPE_1
                    query_based_connector_config:
                      cursor_columns:
                        - updated_at

  # Deployed only by GitHub Actions, as the ridepulse-ci service principal
  # (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET). The default root path
  # puts the bundle state in that principal's own folder, not /Workspace/Shared,
  # which every workspace user could write to.
  stg:
    workspace:
      host: https://dbc-f915d382-6d5f.cloud.databricks.com
    variables:
      catalog: ridepulse_stg
    permissions:
      - level: CAN_MANAGE
        user_name: haokimtieu2001@gmail.com
