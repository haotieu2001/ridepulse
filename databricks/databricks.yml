bundle:
  name: ridepulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: ridepulse_dev
  kafka_bootstrap:
    description: Confluent bootstrap server (also in SSM /ridepulse/confluent/dev/bootstrap_servers).
    default: pkc-921jm.us-east-2.aws.confluent.cloud:9092
  tlc_month:
    description: TLC high-volume FHV month used by feasibility test S10 (YYYY-MM).
    default: "2025-01"

targets:
  dev:
    default: true
    # No `mode: development`: it renames schemas to dev_<user>_raw and ignores an
    # empty name_prefix. The catalog already separates environments, so the
    # plain names the plan uses (ridepulse_dev.raw.tlc) stay.
    workspace:
      profile: ridepulse
    variables:
      catalog: ridepulse_dev
    resources:
      # The forwarder Lambda writes landed files here as ridepulse-forwarder, which may use the raw schema and write
      # this one volume, nothing else (#26, ADR-0002). USE CATALOG is granted in SQL: catalogs are made with SQL here.
      schemas:
        raw:
          grants:
            - principal: e3aee6fd-086b-40d1-9916-c46e9611d6d9   # ridepulse-forwarder
              privileges: [USE_SCHEMA]
      volumes:
        landing:
          grants:
            - principal: e3aee6fd-086b-40d1-9916-c46e9611d6d9   # ridepulse-forwarder
              privileges: [READ_VOLUME, WRITE_VOLUME]
      pipelines:
        # Plan path C (#27): a daily query-based pull of the dispatch database's reference tables, incremental on
        # each table's indexed updated_at cursor (V001), into bronze.neon_*. SCD type 2, so every version a pull
        # saw is kept with when it held: history per pull. What a cursor can't see (a delete, a row changed twice
        # between pulls) is ADR-0005's measurement (#28). Dev only: the neon_dev connection and its secret belong to
        # this environment. No schedule of its own: the daily job (#33) runs it; by hand, `make refpull`.
        reference_pull:
          name: reference_pull
          catalog: ${var.catalog}
          schema: bronze
          ingestion_definition:
            connection_name: neon_dev
            objects:
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: zones
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_zones
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: fare_rules
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_fare_rules
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: driver_profiles
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_driver_profiles
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
      jobs:
        # The window Lambda pauses and unpauses these as ridepulse-window, which may manage these two jobs and nothing
        # else (#25, ADR-0002). In stg nothing unpauses them.
        streaming_back_to_back:
          permissions:
            - service_principal_name: 17447026-e680-4550-8b53-23a3b7ac2f13   # ridepulse-window
              level: CAN_MANAGE
        views_every_10_min:
          permissions:
            - service_principal_name: 17447026-e680-4550-8b53-23a3b7ac2f13   # ridepulse-window
              level: CAN_MANAGE
        # S1 + S2: Confluent Cloud -> Databricks, JSON and Schema Registry Avro.
        # Dev only: the Kafka and Schema Registry keys sit in this workspace's
        # `ridepulse` secret scope (copied from SSM by scripts/feasibility/ssm_to_secret.sh).
        s1_s2_kafka:
          name: s1_s2_kafka
          tasks:
            - task_key: read_kafka
              environment_key: default
              spark_python_task:
                python_file: ./src/feasibility/s1_s2_kafka.py
                parameters:
                  - --catalog
                  - ${var.catalog}
                  - --bootstrap
                  - pkc-921jm.us-east-2.aws.confluent.cloud:9092
                  - --sr-url
                  - https://psrc-zw2j3j2.us-east-2.aws.confluent.cloud
          environments:
            - environment_key: default
              spec:
                environment_version: "3"

  # Deployed only by GitHub Actions, as the ridepulse-ci service principal
  # (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET). The default root path
  # puts the bundle state in that principal's own folder, not /Workspace/Shared,
  # which every workspace user could write to.
  stg:
    workspace:
      host: https://dbc-f915d382-6d5f.cloud.databricks.com
    variables:
      catalog: ridepulse_stg
    permissions:
      - level: CAN_MANAGE
        user_name: haokimtieu2001@gmail.com
