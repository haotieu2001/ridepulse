bundle:
  name: ridepulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: ridepulse_dev
  kafka_bootstrap:
    description: Confluent bootstrap server (also in SSM /ridepulse/confluent/dev/bootstrap_servers).
    default: pkc-921jm.us-east-2.aws.confluent.cloud:9092
  alert_email:
    description: Who gets job and pipeline failure emails (#36); the same person as the SNS ops alerts.
    default: haokimtieu2001@gmail.com
  tlc_month:
    description: TLC high-volume FHV month used by feasibility test S10 (YYYY-MM).
    default: "2025-01"

targets:
  dev:
    default: true
    # No `mode: development`: it renames schemas to dev_<user>_raw and ignores an
    # empty name_prefix. The catalog already separates environments, so the
    # plain names the plan uses (ridepulse_dev.raw.tlc) stay.
    workspace:
      profile: ridepulse
    variables:
      catalog: ridepulse_dev
    resources:
      # The forwarder Lambda writes landed files here as ridepulse-forwarder, which may use the raw schema and write
      # this one volume, nothing else (#26, ADR-0002). USE CATALOG is granted in SQL: catalogs are made with SQL here.
      schemas:
        raw:
          grants:
            - principal: e3aee6fd-086b-40d1-9916-c46e9611d6d9   # ridepulse-forwarder
              privileges: [USE_SCHEMA]
      volumes:
        landing:
          grants:
            - principal: e3aee6fd-086b-40d1-9916-c46e9611d6d9   # ridepulse-forwarder
              privileges: [READ_VOLUME, WRITE_VOLUME]
      # Data quality monitoring (#36): available on Free Edition (checked 2026-11-08). A snapshot profile of the daily
      # economics mart; gold_build refreshes it after each build, so it costs compute only when gold changes.
      quality_monitors:
        daily_economics:
          table_name: ${var.catalog}.gold.agg_daily_economics
          assets_dir: /Workspace/Users/${workspace.current_user.userName}/ridepulse_monitors
          output_schema_name: ${var.catalog}.ops
          snapshot: {}
      # The AI/BI dashboard (#34): written by src/bi/build_dashboard.py. Dev only: its queries name ridepulse_dev.
      dashboards:
        ridepulse:
          display_name: RidePulse
          file_path: ./src/bi/ridepulse.lvdash.json
          warehouse_id: ccb41dc830068dc3
      pipelines:
        # Plan path C (#27): a daily query-based pull of the dispatch database's reference tables, incremental on
        # each table's indexed updated_at cursor (V001), into bronze.neon_*. SCD type 2, so every version a pull
        # saw is kept with when it held: history per pull. What a cursor can't see (a delete, a row changed twice
        # between pulls) is ADR-0005's measurement (#28). Dev only: the neon_dev connection and its secret belong to
        # this environment. No schedule of its own: the daily job (#33) runs it; by hand, `make refpull`.
        reference_pull:
          name: reference_pull
          catalog: ${var.catalog}
          schema: bronze
          ingestion_definition:
            connection_name: neon_dev
            objects:
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: zones
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_zones
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: fare_rules
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_fare_rules
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
              - table:
                  source_catalog: neondb
                  source_schema: dispatch
                  source_table: driver_profiles
                  destination_catalog: ${var.catalog}
                  destination_schema: bronze
                  destination_table: neon_driver_profiles
                  table_configuration:
                    scd_type: SCD_TYPE_2
                    query_based_connector_config:
                      cursor_columns: [updated_at]
      jobs:
        # The daily job (#33): every 15 minutes, a gate finds the simulated days the replay closed and gold hasn't built;
        # for those it pulls the reference tables, ingests landed files, builds gold for the range and records it. Given
        # start and end it's a backfill: the gate is skipped and the range rebuilt (FR-15: twice changes nothing).
        # Paused outside a demo window: the window Lambda unpauses it with the streaming and views jobs.
        # Dev only: it runs reference_pull, which only dev has (the neon_dev connection).
        daily:
          name: daily
          permissions:
            - service_principal_name: 17447026-e680-4550-8b53-23a3b7ac2f13   # ridepulse-window
              level: CAN_MANAGE
          schedule:
            quartz_cron_expression: "0 0/15 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED
          max_concurrent_runs: 1
          parameters:
            - name: start
              default: ""
            - name: end
              default: ""
          tasks:
            - task_key: gate
              environment_key: default
              spark_python_task:
                python_file: ./src/daily/gate.py
                parameters: [gate, --catalog, "${var.catalog}", --src-dir, "${workspace.file_path}/src",
                             "--start={{job.parameters.start}}", "--end={{job.parameters.end}}"]
            - task_key: due
              depends_on: [{task_key: gate}]
              condition_task:
                op: EQUAL_TO
                left: "{{tasks.gate.values.run}}"
                right: "true"
            - task_key: reference_pull
              depends_on: [{task_key: due, outcome: "true"}]
              pipeline_task:
                pipeline_id: ${resources.pipelines.reference_pull.id}
            - task_key: files
              depends_on: [{task_key: due, outcome: "true"}]
              run_job_task:
                job_id: ${resources.jobs.files_ingest.id}
            - task_key: gold
              depends_on: [{task_key: reference_pull}, {task_key: files}]
              run_job_task:
                job_id: ${resources.jobs.gold_build.id}
                job_parameters:
                  start: "{{tasks.gate.values.start}}"
                  end: "{{tasks.gate.values.end}}"
            - task_key: record
              depends_on: [{task_key: gold}]
              environment_key: default
              spark_python_task:
                python_file: ./src/daily/gate.py
                parameters: [record, --catalog, "${var.catalog}", --src-dir, "${workspace.file_path}/src",
                             "--start={{tasks.gate.values.start}}", "--end={{tasks.gate.values.end}}"]
          email_notifications:
            on_failure: ["${var.alert_email}"]
          environments:
            - environment_key: default
              spec:
                environment_version: "3"
        # The window Lambda pauses and unpauses these as ridepulse-window, which may manage these two jobs and nothing
        # else (#25, ADR-0002). In stg nothing unpauses them.
        streaming_back_to_back:
          permissions:
            - service_principal_name: 17447026-e680-4550-8b53-23a3b7ac2f13   # ridepulse-window
              level: CAN_MANAGE
        views_every_10_min:
          permissions:
            - service_principal_name: 17447026-e680-4550-8b53-23a3b7ac2f13   # ridepulse-window
              level: CAN_MANAGE
        # S1 + S2: Confluent Cloud -> Databricks, JSON and Schema Registry Avro.
        # Dev only: the Kafka and Schema Registry keys sit in this workspace's
        # `ridepulse` secret scope (copied from SSM by scripts/feasibility/ssm_to_secret.sh).
        s1_s2_kafka:
          name: s1_s2_kafka
          tasks:
            - task_key: read_kafka
              environment_key: default
              spark_python_task:
                python_file: ./src/feasibility/s1_s2_kafka.py
                parameters:
                  - --catalog
                  - ${var.catalog}
                  - --bootstrap
                  - pkc-921jm.us-east-2.aws.confluent.cloud:9092
                  - --sr-url
                  - https://psrc-zw2j3j2.us-east-2.aws.confluent.cloud
          environments:
            - environment_key: default
              spec:
                environment_version: "3"

  # Deployed only by GitHub Actions, as the ridepulse-ci service principal
  # (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET). The default root path
  # puts the bundle state in that principal's own folder, not /Workspace/Shared,
  # which every workspace user could write to.
  stg:
    workspace:
      host: https://dbc-f915d382-6d5f.cloud.databricks.com
    variables:
      catalog: ridepulse_stg
    permissions:
      - level: CAN_MANAGE
        user_name: haokimtieu2001@gmail.com
