bundle:
  name: ridepulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: ridepulse_dev
  tlc_month:
    description: TLC high-volume FHV month used by feasibility test S10 (YYYY-MM).
    default: "2025-01"

targets:
  dev:
    default: true
    # No `mode: development`: it renames schemas to dev_<user>_raw and ignores an
    # empty name_prefix. The catalog already separates environments, so the
    # plain names the plan uses (ridepulse_dev.raw.tlc) stay.
    workspace:
      profile: ridepulse
    variables:
      catalog: ridepulse_dev

  # Deployed only by GitHub Actions, as the ridepulse-ci service principal
  # (DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET). The default root path
  # puts the bundle state in that principal's own folder, not /Workspace/Shared,
  # which every workspace user could write to.
  stg:
    workspace:
      host: https://dbc-f915d382-6d5f.cloud.databricks.com
    variables:
      catalog: ridepulse_stg
    permissions:
      - level: CAN_MANAGE
        user_name: haokimtieu2001@gmail.com
