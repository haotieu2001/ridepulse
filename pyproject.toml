[project]
name = "ridepulse"
version = "0.1.0"
description = "RidePulse: ride-hailing data platform on real NYC TLC trips"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.121",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "services", "db"]
pythonpath = ["."]
addopts = "-q"
