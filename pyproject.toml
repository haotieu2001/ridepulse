[project]
name = "ridepulse"
version = "0.1.0"
description = "RidePulse: ride-hailing data platform on real NYC TLC trips"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.121",
    "confluent-kafka==2.16.0",
    "fastavro==1.13.1",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"
# Phase 0's feasibility scripts are kept as they ran; data/ and build/ are local scratch.
extend-exclude = ["databricks/src/feasibility", "scripts/feasibility", "data", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "services", "db"]
pythonpath = ["."]
addopts = "-q"
