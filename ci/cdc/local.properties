# CI's cdc job (#76) runs Debezium with infra/terraform/debezium/env/dev.properties followed by this file: a later key
# wins, so the routing under test is dev's own, and only the endpoints (which dev's boot script fills from SSM) differ:
# the job's Postgres, and Redpanda as Kafka, one broker, no TLS.
debezium.source.database.hostname=localhost
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=postgres
debezium.sink.kafka.producer.bootstrap.servers=localhost:9092
debezium.source.bootstrap.servers=localhost:9092
debezium.source.offset.storage.replication.factor=1
